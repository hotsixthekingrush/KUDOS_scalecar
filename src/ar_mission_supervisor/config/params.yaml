mission_supervisor:
  ros__parameters:
    control_rate: 20.0
    wheel_base: 0.2
    base_speed: 0.3
    max_steer: 0.4636          # atan(L / R_min), R_min = 0.4 m

    lane:
      kp_lateral: 1.2
      kd_lateral: 0.15
      kp_heading: 0.8

    failsafe:
      hold_sec: 1.0
      creep_speed: 0.12
      stop_after_sec: 5.0
      wall_sector_deg: 30.0
      wall_max_range: 0.8

    perception:
      stale_sec: 0.5
      debounce_count: 3
      lockout_sec: 8.0
      exit_miss_count: 3

    zone:
      red_speed: 0.13
      blue_speed: 0.6

    crosswalk:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.6
      stop_distance: 0.30       # base_link ~ 횡단보도 앞쪽 끝 (차체 앞 0.16 + 여유)
      approach_timeout: 12.0    # 1.5m 앞에서 감속 접근하는 시간 확보
      wait_sec: 6.0

    gate:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.6
      stop_distance: 0.25
      open_confirm_sec: 0.3
      max_wait_sec: 30.0
      approach_timeout: 8.0

    cone:
      speed: 0.25
      creep_speed: 0.10
      lookahead: 0.55
      curve_gain: 0.35
      roi_min_x: 0.05
      roi_max_x: 2.0
      roi_max_y: 1.0
      max_radius: 0.18
      pair_max_dx: 0.45
      min_gate_width: 0.30
      side_offset: 0.22
      robot_width: 0.22
      max_duration: 40.0

    left_right:
      trigger_distance: 0.8
      approach_speed: 0.25
      shift_speed: 0.25
      lane_width: 0.40
      shift_duration: 2.5
      settle_sec: 1.0
      approach_timeout: 10.0
      max_duration: 20.0

    roundabout:
      approach_speed: 0.22
      min_speed: 0.08
      cross_speed: 0.30
      slowdown_distance: 0.8
      entry_distance: 0.55
      island_min_radius: 0.15
      track_max_range: 2.0
      conflict_x: 0.5
      conflict_radius: 0.35
      cross_duration: 2.5
      safety_buffer: 0.8
      fallback_after: 9.0
      fallback_ratio: 0.4
      emergency_distance: 0.30
      emergency_hold: 1.5
      clear_margin: 1.6
      min_speed_for_prediction: 0.05
      approach_timeout: 8.0
      max_duration: 45.0

    parking:
      side: left
      scan_speed: 0.15
      turn_offset: 0.40
      reverse_speed: 0.12
      align_speed: 0.08
      yaw_tolerance: 0.05
      clearance: 0.10
      robot_length: 0.322
      k_heading: 1.0
      k_lateral: 1.5
      phase_pause: 0.5
      scan_timeout: 25.0
      turn_timeout: 12.0
      align_timeout: 10.0

    yolo:
      event_range: 1.5
      gate_open_angle: 1.0

    debug:
      enabled: true           # 대회 때는 false