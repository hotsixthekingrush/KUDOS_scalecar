# viewpoint_sampler 가 로봇을 순간이동시킬 구역 — 새 맵 v2 (track_2026.world) 기준, 10/29
#
# 좌표: 경기장 x 0~10, y 0~6 (왼쪽 아래가 원점). 시계방향 주행
#   아래 직선      : -x 방향으로 달림 (3차선 정차 LIMO → 갈림길 A/B)
#   안쪽 윗 직선   : +x 방향으로 달림, 중앙 y≈4.85 (횡단보도·신호등 → T자 주차)
#
# type facing: target 앞(normal_yaw 방향)으로 dist 만큼, 그 방향을 왼쪽으로 90도 돌린 쪽으로
#              lateral 만큼 떨어진 곳에 로봇을 놓고 target 을 보게 한다 (± yaw_jitter)
#
# 시뮬 표지판 그림(지름 22.4cm)이 규정 도면 예시(Ø80)보다 커서, 작게 보이는 경우도 나오도록
# dist 를 최대 3.5~4m 까지 잡았다. 0.6m 보다 가까우면 표지판 윗부분이 화면 밖으로 잘린다.
# weight: 이 구역을 뽑는 상대 비율. 필요 없는 구역은 0 으로.

regions:
  # M2 갈림길 표지판 (4.15, 0.95), 앞면 +x
  #   normal_yaw 0 → lateral + 가 +y 쪽. ±0.6 = 3차선(y 0.43 / 0.95 / 1.47) 전체
  - {name: branch,        type: facing, target: [4.15, 0.95], normal_yaw: 0.0,
     dist: [0.6, 4.0], lateral: [-0.6, 0.6], yaw_jitter: 0.35, weight: 2.0}

  # M4 주차 표지판 (6.0, 4.42), 앞면 -x
  #   normal_yaw pi → lateral + 가 -y 쪽. 로봇 y = 4.42 - lateral = 4.62 ~ 5.07 (안쪽 윗 직선)
  - {name: parking,       type: facing, target: [6.0, 4.42], normal_yaw: 3.1416,
     dist: [0.6, 3.5], lateral: [-0.65, -0.2], yaw_jitter: 0.35, weight: 1.5}

  # M1 신호등 (3.88, 4.43), 앞면 -x. 실물 신호등 오기 전 시뮬 데이터용 (안 모으려면 weight: 0)
  - {name: traffic_light, type: facing, target: [3.88, 4.43], normal_yaw: 3.1416,
     dist: [0.6, 2.5], lateral: [-0.65, -0.2], yaw_jitter: 0.35, weight: 1.0}

# 로봇을 놓으면 안 되는 곳. 중심 [x, y] 에서 r(m) 이내면 다시 뽑는다.
avoid:
  - {xy: [4.15, 0.95], r: 0.30}    # 갈림길 표지판 기둥
  - {xy: [6.0, 4.42],  r: 0.30}    # 주차 표지판 기둥
  - {xy: [3.88, 4.43], r: 0.25}    # 신호등 기둥
  # 3차선 정차 LIMO 7대 (0.32 x 0.22 m)
  - {xy: [8.1, 0.95],  r: 0.40}
  - {xy: [7.55, 1.47], r: 0.40}
  - {xy: [7.0, 0.43],  r: 0.40}
  - {xy: [6.45, 0.95], r: 0.40}
  - {xy: [5.9, 1.47],  r: 0.40}
  - {xy: [5.35, 0.43], r: 0.40}
  - {xy: [4.8, 0.95],  r: 0.40}
  # T자 주차 칸 양옆 정차 LIMO
  - {xy: [6.36, 4.27], r: 0.40}
  - {xy: [7.39, 4.27], r: 0.40}
